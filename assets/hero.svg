<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="52%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#112238"/>
    </linearGradient>
    <radialGradient id="cobaltGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(215 175) rotate(18) scale(390 240)">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="65%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(970 190) rotate(-18) scale(360 230)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 72) scale(180 110)">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="url(#cobaltGlow)"/>
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="url(#tealGlow)"/>
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="url(#amberGlow)"/>

  <!-- Left Section: Eyebrow + Emblem + Wordmark + Subtitle + Chips -->
  <g transform="translate(56, 48)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="386" height="28" rx="14" fill="#3B82F6" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#34D399"/>
    <text x="28" y="18.5" fill="#BFDBFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.8">APHYGO PLUGIN v1.0 · WIN · MACOS · LINUX</text>

    <!-- Emblem + Title -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="76" height="76" rx="18" fill="#0D192E" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.5"/>
      <!-- Stacked Desktop Windows + Accessibility Cursor Node -->
      <rect x="13" y="16" width="42" height="32" rx="6" fill="#0B1324" stroke="#475569" stroke-width="2"/>
      <rect x="20" y="24" width="44" height="34" rx="7" fill="#0F1D36" stroke="url(#accentGrad)" stroke-width="2.5"/>
      <circle cx="28" cy="32" r="2.4" fill="#F87171"/>
      <circle cx="35.5" cy="32" r="2.4" fill="#FBBF24"/>
      <circle cx="43" cy="32" r="2.4" fill="#34D399"/>
      <!-- Set-of-Mark target box inside window -->
      <rect x="26" y="40" width="22" height="11" rx="3" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-width="1.4"/>
      <!-- Pointer arrow -->
      <path d="M 52 44 L 64 56 L 57.5 57.5 L 55 63.5 Z" fill="#F8FAFC" stroke="#0B1324" stroke-width="1.2" stroke-linejoin="round"/>

      <text x="94" y="34" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.7">Antigravity Pilot</text>
      <text x="95" y="62" fill="#5EEAD4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600">Cross-Platform Computer Use &amp; Parallel Desktops</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="162" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.2">Headless AX/UIA/AT-SPI control, zero-dep Set-of-Mark overlays, deterministic</text>
    <text x="0" y="186" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.2">Risk-Guard, parameterized recipes &amp; &lt;1s noVNC Docker sandboxes.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 222)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="166" height="30" rx="8" fill="#132238" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="83" y="19" text-anchor="middle" fill="#93C5FD">Win · macOS · Linux</text>

      <rect x="176" y="0" width="114" height="30" rx="8" fill="#132238" stroke="#475569" stroke-width="1"/>
      <text x="233" y="19" text-anchor="middle" fill="#F8FAFC">Set-of-Mark</text>

      <rect x="300" y="0" width="108" height="30" rx="8" fill="#231C14" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1"/>
      <text x="354" y="19" text-anchor="middle" fill="#FCD34D">Risk-Guard</text>

      <rect x="418" y="0" width="144" height="30" rx="8" fill="#112A2A" stroke="#10B981" stroke-opacity="0.55" stroke-width="1"/>
      <text x="490" y="19" text-anchor="middle" fill="#6EE7B7">Parallel noVNC</text>
    </g>
  </g>

  <!-- Right Section: Live Operator + Sandbox Console Card -->
  <g transform="translate(662, 46)">
    <rect x="0" y="0" width="484" height="288" rx="16" fill="#070B14" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect x="0" y="0" width="484" height="36" rx="16" fill="#0F172A"/>
    <path d="M0 22H484V36H0Z" fill="#0F172A"/>
    <line x1="0" y1="36" x2="484" y2="36" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444" fill-opacity="0.85"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B" fill-opacity="0.85"/>
    <circle cx="52" cy="18" r="5" fill="#10B981" fill-opacity="0.85"/>
    <text x="256" y="22" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">desktop-operator · zero-MCP hybrid CLI</text>

    <!-- Terminal Lines -->
    <g transform="translate(20, 62)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <text x="0" y="0" fill="#60A5FA">$</text>
      <text x="15" y="0" fill="#F8FAFC">agent-desktop snapshot --app Chrome -i --compact</text>
      <text x="0" y="20" fill="#34D399">✓ 87 AX/UIA refs in 210ms · headless (no focus steal)</text>

      <text x="0" y="52" fill="#60A5FA">$</text>
      <text x="15" y="52" fill="#F8FAFC">pilot_ctl.py screenshot out.png --app Code --annotate</text>
      <text x="0" y="72" fill="#93C5FD">✓ Zero-dep Set-of-Mark overlay rendered [e1..e64]</text>

      <text x="0" y="104" fill="#60A5FA">$</text>
      <text x="15" y="104" fill="#F8FAFC">pilot_ctl.py recipe run deploy-check --dry-run</text>
      <text x="0" y="124" fill="#FCD34D">⚠ RISK_GUARD_BLOCKED (exit 2): "Delete" needs approval</text>

      <text x="0" y="156" fill="#60A5FA">$</text>
      <text x="15" y="156" fill="#F8FAFC">sandbox_ctl.py up desk-1 --vnc</text>
      <text x="0" y="176" fill="#5EEAD4">✓ Virtual desktop ready in 0.76s · http://127.0.0.1:6080</text>
    </g>

    <!-- Bottom Status Strip -->
    <line x1="16" y1="256" x2="468" y2="256" stroke="#1E293B" stroke-width="1"/>
    <circle cx="28" cy="272" r="4" fill="#10B981"/>
    <text x="40" y="276" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">agent-desktop · zero-dep pilot_ctl.py · Docker noVNC</text>
  </g>
</svg>
