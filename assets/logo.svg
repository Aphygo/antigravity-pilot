<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="screenGrad" x1="16" y1="20" x2="112" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="28" y1="40" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="72" y1="56" x2="104" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Outer macOS window frame (~10% margin: x=14..114, y=18..100) -->
  <rect x="14" y="18" width="100" height="78" rx="12" fill="url(#screenGrad)" stroke="#64748B" stroke-width="2.5"/>

  <!-- Window titlebar -->
  <path d="M15.25 30C15.25 23.51 20.51 19.25 27 19.25H101C107.49 19.25 112.75 23.51 112.75 30V36H15.25V30Z" fill="#334155"/>
  <line x1="15.25" y1="36" x2="112.75" y2="36" stroke="#475569" stroke-width="1.5"/>

  <!-- Traffic-light window controls -->
  <circle cx="27" cy="27.5" r="3.2" fill="#FB7185"/>
  <circle cx="38" cy="27.5" r="3.2" fill="#FBBF24"/>
  <circle cx="49" cy="27.5" r="3.2" fill="#34D399"/>

  <!-- Subtle semantic UI / Accessibility tree nodes inside window -->
  <rect x="26" y="47" width="34" height="12" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.75"/>
  <rect x="26" y="66" width="22" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <rect x="54" y="66" width="26" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>

  <!-- Orchestration node ring & connector -->
  <circle cx="72" cy="53" r="5" fill="url(#accentGrad)"/>
  <circle cx="72" cy="53" r="9.5" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="60" y1="53" x2="67" y2="53" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Mac display stand -->
  <path d="M54 96H74L78 108H50L54 96Z" fill="#475569"/>
  <rect x="42" y="106" width="44" height="5" rx="2.5" fill="#64748B"/>

  <!-- Crisp pointer cursor overlapping lower-right -->
  <path d="M77 61L77 95L86 87.5L92.5 101L98.5 98L92 84.5L103 83.5L77 61Z"
        fill="url(#cursorGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
